# LDAP scenarios for ad-create-group action
action:
  params:
    groupDN: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
    samAccountName: TestGroup
    description: Test group for SGNL Actions testing
    groupType: security
    groupScope: global
    dry_run: false
    successIfAlreadyExists: false
  context:
    secrets:
      LDAP_BIND_DN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
      LDAP_BIND_PASSWORD: Welcome123!
    environment:
      ADDRESS: ldap://managed-adapter-ad-5b022a4e7e96be14.elb.us-east-2.amazonaws.com:389

scenarios:
  - name: successfully create security group
    steps:
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: add
          dn: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
          entry:
            objectClass: ["top", "group"]
            cn: Test Group
            sAMAccountName: TestGroup  
            groupType: "-2147483646"
            description: Test group for SGNL Actions testing
        fixture: fixtures/200-add-success.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        groupDN: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
        created: true
        alreadyExisted: false
        attributes: ["sAMAccountName", "description"]
        groupType: security
        groupScope: global

  - name: group already exists - treat as success
    params:
      successIfAlreadyExists: true
    steps:
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: add
          dn: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
          entry:
            objectClass: ["top", "group"]
            cn: Test Group
            sAMAccountName: TestGroup
            groupType: "-2147483646"
            description: Test group for SGNL Actions testing
        fixture: fixtures/68-add-already-exists.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        groupDN: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
        created: false
        alreadyExisted: true
        attributes: ["sAMAccountName", "description"]
        groupType: security
        groupScope: global

  - name: group already exists - should fail
    steps:
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: add
          dn: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
          entry:
            objectClass: ["top", "group"]
            cn: Test Group
            sAMAccountName: TestGroup
            groupType: "-2147483646"
            description: Test group for SGNL Actions testing
        fixture: fixtures/68-add-already-exists.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      throws: "Entry already exists"
    error:
      throws: "Group already exists"

  - name: authentication failed
    steps:
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/49-bind-error.ldap
    invoke:
      throws: "Invalid credentials"
    error:
      throws: "LDAP authentication failed"

  - name: insufficient permissions to create group
    steps:
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: add
          dn: CN=Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
          entry:
            objectClass: ["top", "group"]
            cn: Test Group
            sAMAccountName: TestGroup
            groupType: "-2147483646"
            description: Test group for SGNL Actions testing
        fixture: fixtures/50-add-insufficient-permissions.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      throws: "Insufficient access rights"
    error:
      throws: "Insufficient LDAP permissions"

  - name: idempotent group creation - first call creates, second call succeeds
    params:
      successIfAlreadyExists: true
      groupDN: CN=Idempotent Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
      samAccountName: IdempotentTestGroup
      description: Test group for idempotency testing
    steps:
      # First call - group doesn't exist, should create successfully
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: add
          dn: CN=Idempotent Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
          entry:
            objectClass: ["top", "group"]
            cn: Idempotent Test Group
            sAMAccountName: IdempotentTestGroup
            groupType: "-2147483646"
            description: Test group for idempotency testing
        fixture: fixtures/200-add-success.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        groupDN: CN=Idempotent Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
        created: true
        alreadyExisted: false
        attributes: ["sAMAccountName", "description"]
        groupType: security
        groupScope: global

  - name: idempotent group creation - second call with same params succeeds
    params:
      successIfAlreadyExists: true
      groupDN: CN=Idempotent Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
      samAccountName: IdempotentTestGroup
      description: Test group for idempotency testing
    steps:
      # Second call - group already exists, should succeed with alreadyExisted: true
      - ldap:
          operation: bind
          bindDN: CN=testuser,OU=Users,OU=adaptertest,DC=adaptertest,DC=sgnl,DC=ai
          password: "[MASKED]"
        fixture: fixtures/200-bind-success.ldap
      - ldap:
          operation: add
          dn: CN=Idempotent Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
          entry:
            objectClass: ["top", "group"]
            cn: Idempotent Test Group
            sAMAccountName: IdempotentTestGroup
            groupType: "-2147483646"
            description: Test group for idempotency testing
        fixture: fixtures/68-add-already-exists.ldap
      - ldap:
          operation: unbind
        fixture: fixtures/200-unbind-success.ldap
    invoke:
      returns:
        status: success
        groupDN: CN=Idempotent Test Group,OU=Groups,DC=adaptertest,DC=sgnl,DC=ai
        created: false
        alreadyExisted: true
        attributes: ["sAMAccountName", "description"]
        groupType: security
        groupScope: global